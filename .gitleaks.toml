# gitleaks 配置 —— 在默认规则集之上补三条本项目实测漏检的规则。
# 用法见 scripts/install-git-hooks.sh（装 pre-commit / pre-push 门禁）。
#
# 背景：一次全库基线扫描里，gitleaks 默认规则只报出了风险最低的一项（JWT），
# 漏掉了最严重的两项——10 字符的管理员密码（熵不够，任何规则都不触发）和
# PAN-OS API Key（厂商专有格式，默认规则集没有）。下面三条就是补这个缺口。

title = "NGFW Monitor"

[extend]
useDefault = true

# ---- 1. PAN-OS API Key ----
# keygen 接口返回的 key 固定以 LUFRPT 开头，长度 100+，base64 字符集。
[[rules]]
id = "panos-api-key"
description = "PAN-OS API Key（keygen 输出）"
regex = '''LUFRPT[A-Za-z0-9+/=]{20,}'''
keywords = ["lufrpt"]

# ---- 2. URL 查询串里的凭据 ----
# 命中来源：文档/日志里粘贴的 curl 命令，例如
#   curl -k "https://<fw>/api/?type=keygen&user=admin&password=<明文>"
# 默认规则不看 URL 参数，这类明文密码会完整地留在仓库里。
[[rules]]
id = "credential-in-url-query"
description = "URL 查询串里的明文凭据"
regex = '''(?i)[?&](?:password|passwd|pwd|api[-_]?key|apikey|token|secret)=[^\s"'&<]{3,}'''
keywords = ["password=", "passwd=", "pwd=", "api_key=", "apikey=", "token=", "secret="]

  [rules.allowlist]
  regexTarget = "match"
  # 占位符不算泄露
  regexes = [
    '''(?i)(x{3,}|change[-_ ]?me|changeme|your[-_ ]|placeholder|todo|example|\.\.\.|<[^>]*>|\$\{|%s|\{\{)''',
    '''请修改''',
  ]

# ---- 3. *.example 模板里写了真值 ----
# 命中来源：env.example 里 ADMIN_INIT_PASSWORD 填的是线上实际在用的密码。
# 示例文件本该只有占位符；出现具体值就是把凭据发布出去了。
[[rules]]
id = "concrete-secret-in-example-file"
description = "示例配置文件里出现了非占位符的具体凭据值"
path = '''\.example$'''
# 注意：gitleaks 把整个文件当一个字符串匹配，`\s` 会跨行，
# 空值的 `SMTP_PASSWORD=` 会把下一行当成自己的值。所以只允许 [ \t]。
regex = '''(?i)[a-z0-9_]*(?:password|passwd|secret|token|api[-_]?key)[a-z0-9_]*[ \t]*=[ \t]*([^\s#]{3,})'''
keywords = ["password", "passwd", "secret", "token", "key"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''(?i)(x{3,}|change[-_ ]?me|changeme|your[-_ ]|placeholder|todo|example|\.\.\.|<[^>]*>|\$\{|随机|强密码)''',
    '''请修改''',
  ]
