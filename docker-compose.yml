services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # 容器内是 8443/8080 而不是 443/80：nginx 以非 root 运行，绑不了特权端口
    ports:
      - "3000:8443"
      - "3080:8080"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - reportdata:/app/data/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -l info
    env_file:
      - .env
    volumes:
      - reportdata:/app/data/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # schedule 文件默认写在 CWD(/app)，容器改非 root 后那里不可写。
    # 内容只是各任务的上次执行时间，容器重建本来就会丢，放 /tmp 等价。
    command: celery -A app.tasks.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      - redis

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngfw_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-ngfw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngfw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  reportdata:
