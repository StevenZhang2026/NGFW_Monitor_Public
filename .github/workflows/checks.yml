# 正确性检查。与 security-gate.yml 分开：那个是安全扫描，这个是「代码还成立吗」。
#
# 两个 job 互不依赖，并行跑。
#
# frontend-typecheck：tsc 本来就在跑（package.json 的 build 是 `tsc && vite build`），
# 但只在构建镜像时才炸，PR 上看不见 —— 类型错误要等到有人 docker compose build
# 才暴露。这里把它提到合并前。npm ci 顺带校验 lockfile：与 package.json 不一致时直接
# 失败，不会像 npm install 那样悄悄重新解析版本。
#
# backend-tests：不复用 scripts/test-backend.sh。那个脚本绕 Docker 是因为**宿主机**
# 没有 Python 3.11 和 lxml；CI 有 setup-python，绕一趟等于每次跑都重建后端镜像
# （apt-get + pip，几分钟）。这里直接装依赖跑 pytest。
# 已验证：python:3.11-slim 上纯 pip 装、不装 Dockerfile 里那些系统库
# （libcairo/libpango 等，只有 weasyprint 出 PDF 时才需要）、也没有 .env
# （config.py 每个字段都有默认值），59 个测试全过。
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 frontend/Dockerfile 的 node:20-alpine 对齐
          node-version: '20'
          cache: npm
          # lockfile 不在仓库根目录，不指这条 cache 找不到它
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.11-slim 对齐
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # 与 scripts/test-backend.sh 写法保持一致（那边用 python -m 是因为 pip --user
      # 装的 pytest 不在 PATH 上；这里 PATH 没问题，纯粹为了两处命令看起来一样）
      - run: python -m pytest -q
