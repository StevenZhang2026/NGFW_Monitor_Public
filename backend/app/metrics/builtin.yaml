# Built-in metric definitions
# These are loaded on first startup and cannot be deleted (only disabled)

- name: cpu_usage
  display_name: "CPU 使用率"
  category: system_resource
  collector: panos_api
  command: "<show><system><resources></resources></system></show>"
  parser:
    type: regex_cdata_fields
    # Sum every field on top's %Cpu(s) line except idle.
    #
    # Do not "read one field" here, in either direction. Measured on PA-440
    # (4 cores, PAN-OS 11.x), the fields on that line do not add up to 100 and
    # the shortfall moves with load — sums of 33.3 / 39.9 / 53.0 / 86.6 / 92.5
    # across five samples four seconds apart:
    #   - `100 - id` read 86.7% and 100% on samples where the process list
    #     accounted for 18.6% and 81.1% of CPU. `id` is the least trustworthy
    #     field on the line; a metric built on it reads near-pegged forever.
    #   - `us` alone does track the process list, but drops sy/ni/hi — 11.6
    #     points on the busy sample, which at a threshold of 80 is the
    #     difference between alerting and not.
    # Summing the non-idle fields matched the process list on both samples
    # (22.1 vs 18.6, 86.5 vs 81.1). See parser.py for the measurements.
    pattern: "%Cpu\\(s\\):(.*)"
    field_pattern: "([\\d.]+)\\s+(\\w+)"
    exclude: ["id"]
    # `us` alone has been collected at 105.8 and 118.4 on this device, so some
    # samples off this line are impossible whatever the formula — top's single
    # -iteration output is quantised (a bare `31 us`, no decimal, shows up).
    # Stored as a gauge such a figure looks authoritative forever and feeds
    # threshold alerts, so out of range is a collection failure instead.
    range: [0, 100]
  data_type: gauge
  unit: "%"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: line

- name: memory_usage
  display_name: "内存使用率"
  category: system_resource
  collector: panos_api
  command: "<show><system><resources></resources></system></show>"
  parser:
    type: regex_cdata
    # PAN-OS 11.x reports `MiB Mem :  15725.1 total, ... 7028.8 used` — the unit
    # scales with total RAM and the figures carry decimals, so neither `KiB` nor
    # an integer-only pattern can be assumed. The ratio is unit-independent, so
    # the prefix is simply left open.
    pattern: "[KMG]iB Mem\\s*:\\s*([\\d.]+)\\s+total.*?([\\d.]+)\\s+used"
    calc: "value1 / value0 * 100"
    # A ratio that lands outside 0-100 means the pattern picked up the wrong two
    # figures. Same reasoning as cpu_usage.
    range: [0, 100]
  data_type: gauge
  unit: "%"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: line

- name: session_count
  display_name: "活跃会话数"
  category: system_resource
  collector: panos_api
  command: "<show><session><info></info></session></show>"
  parser:
    type: xpath
    expr: ".//num-active"
    # PA-5500 / PA-7000 answer `show session info` once per dataplane, so this
    # expression matches once per DP there and the parser refuses to guess (see
    # parser.py). Active sessions are additive across dataplanes, so sum.
    on_multiple: sum
  data_type: gauge
  unit: "sessions"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: area

- name: session_max
  display_name: "最大会话数"
  category: system_resource
  collector: panos_api
  command: "<show><session><info></info></session></show>"
  parser:
    type: xpath
    expr: ".//num-max"
    # Deliberately no on_multiple: it is not known whether a multi-dataplane
    # device reports its own per-DP capacity (then: sum) or repeats one
    # system-wide limit (then: first). Guessing sum would multiply the capacity
    # by the DP count, and this figure is the denominator of session
    # utilisation — a wrong value here inflates headroom and hides saturation.
    # So it stays a hard failure until it can be read off a real PA-5500/7000,
    # at which point this is a one-line change.
  data_type: gauge
  unit: "sessions"
  interval: 300
  interval_min: 60
  interval_max: 600
  chart_type: line

- name: session_cps
  display_name: "每秒新建会话"
  category: system_resource
  collector: panos_api
  command: "<show><session><info></info></session></show>"
  parser:
    type: xpath
    expr: ".//cps"
    # Additive across dataplanes, same as session_count.
    on_multiple: sum
  data_type: gauge
  unit: "cps"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: line

- name: session_kbps
  display_name: "吞吐量"
  category: system_resource
  collector: panos_api
  command: "<show><session><info></info></session></show>"
  parser:
    type: xpath
    expr: ".//kbps"
    # Additive across dataplanes, same as session_count.
    on_multiple: sum
  data_type: gauge
  unit: "kbps"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: area

- name: temperature
  display_name: "设备温度"
  category: hardware
  collector: panos_ssh
  command: "show system environmentals"
  parser:
    type: regex_multi
    pattern: "(?m)^\\s*(\\S+)\\s+.+?\\s+(?:True|False)\\s+([\\d.]+)"
  data_type: gauge
  unit: "°C"
  interval: 300
  interval_min: 60
  interval_max: 600
  chart_type: line

- name: interface_throughput_in
  display_name: "接口入向速率"
  category: network
  collector: panos_api
  command: "<show><counter><interface>all</interface></counter></show>"
  # Stored exactly as PAN-OS reports it — a monotonic byte counter — and turned
  # into a rate at query time. `rate.scale` converts bytes/s into the `unit`
  # below (×8 bits ÷1000), which is kbps so it lines up with session_kbps, the
  # device's own throughput figure. It lives under `parser` because the schema
  # is created with create_all and has no migration tooling for a new column.
  parser:
    type: xpath_multi
    entries_expr: ".//ifnet/ifnet/entry"
    value_expr: "ibytes/text()"
    label_expr: "name/text()"
    rate:
      scale: 0.008
  data_type: counter
  unit: "kbps"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: area

- name: interface_throughput_out
  display_name: "接口出向速率"
  category: network
  collector: panos_api
  command: "<show><counter><interface>all</interface></counter></show>"
  # See interface_throughput_in for why the counter is stored raw and scaled here.
  parser:
    type: xpath_multi
    entries_expr: ".//ifnet/ifnet/entry"
    value_expr: "obytes/text()"
    label_expr: "name/text()"
    rate:
      scale: 0.008
  data_type: counter
  unit: "kbps"
  interval: 60
  interval_min: 10
  interval_max: 300
  chart_type: area

- name: ha_state
  display_name: "HA 状态"
  category: ha
  collector: panos_api
  command: "<show><high-availability><all></all></high-availability></show>"
  parser:
    type: xpath
    expr: ".//group/local-info/state"
  data_type: gauge
  unit: ""
  interval: 60
  interval_min: 30
  interval_max: 300
  chart_type: line

- name: acc_application
  display_name: "应用流量 (ACC)"
  category: acc
  collector: panos_report
  command: ""
  # Device-side aggregation. interval doubles as the bucket size and is
  # floored to a multiple of 900s — the firewall's own ACC granularity.
  #
  # Reads the traffic-summary database (trsum), which is what the ACC
  # Application Usage widget shows. The obvious-looking named report
  # `top-applications-summary` reads `appstat` instead and undercounts wildly
  # (measured on PA-440: 253 MB vs 1407 MB for one hour, 2.5 MB vs 590 MB for
  # another) — do not go back to it.
  #
  # Keep `values` to bytes and sessions. Adding `packets` makes the device
  # return success with zero rows, which is indistinguishable from an idle
  # bucket, so a bad member here fails silently.
  parser:
    reports:
      - database: trsum
        aggregate_by: ["app", "risk-of-app"]
        values: ["bytes", "sessions"]
        sortby: "bytes"
    topn: 100
    key_field: "app"
    name_field: "app"
    label_name: "application"
    value_field: "bytes"
    label_fields:
      sessions: "sessions"
      risk: "risk-of-app"
  data_type: gauge
  unit: "KB"
  interval: 900
  interval_min: 900
  interval_max: 86400
  chart_type: area

- name: acc_threat
  display_name: "威胁统计 (ACC)"
  category: acc
  collector: panos_report
  command: ""
  # top-attacks-acc already spans every threat subtype (spyware, vulnerability,
  # virus) in one report. Do not add the per-subtype reports alongside it:
  # top-spyware-threats-summary and top-spyware-download-summary return the
  # same rows, so merging them double-counts spyware.
  # Keyed by tid because distinct threats can share a display name.
  #
  # The unfiltered report is ranked by count and truncated at topn, so a
  # Critical seen twice loses its slot to noise seen thousands of times. The
  # severity-filtered passes give critical and high their own topn budget, so
  # they can never be crowded out. `query` filters within the native time
  # window and reports identical counts, so the passes overlap the unfiltered
  # report rather than adding to it — see the merge rules in panos_report.py.
  parser:
    reports:
      - name: top-attacks-acc
      - name: top-attacks-acc
        query: "(severity eq critical)"
      - name: top-attacks-acc
        query: "(severity eq high)"
    topn: 100
    key_field: "tid"
    name_field: "threatid"
    label_name: "threat_name"
    value_field: "count"
    label_fields:
      severity: "severity-of-threatid"
      category: "subtype"
  data_type: gauge
  unit: "count"
  interval: 900
  interval_min: 900
  interval_max: 86400
  chart_type: line
